name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (pnpm@10.34.5) — don't pin here too
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format --check
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm exec astro check
      - name: Build
        run: pnpm run build
